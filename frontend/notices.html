<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>सूचना · लहान नगरपालिका</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/main.css" rel="stylesheet" />
  <link href="assets/css/kiosk.css" rel="stylesheet" />
  <link href="assets/css/department.css" rel="stylesheet" />
  <style>
    .notice-list { display: grid; gap: 14px; padding: 24px 28px; }
    .notice-item { display: grid; grid-template-columns: 110px 1fr auto; gap: 18px; align-items: center;
      background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--np-blue);
      border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm); }
    .notice-item--urgent { border-left-color: var(--np-red); background: var(--np-red-100); }
    .notice-date { text-align: center; background: var(--np-blue); color: #fff; border-radius: 12px; padding: 10px; }
    .notice-date__day  { font: 800 28px/1 var(--font-en); }
    .notice-date__mon  { font-size: 13px; opacity: .9; }
    .notice-title { font-size: 22px; font-weight: 700; color: var(--np-blue-700); }
    .notice-summary { color: var(--ink-muted); margin-top: 4px; }
    .notice-cat { background: var(--np-blue-100); color: var(--np-blue-700); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body class="kiosk" data-page="notices">

  <header class="top-bar">
    <div class="brand">
      <img src="assets/img/logo.svg" class="brand__logo" alt="logo"/>
      <div class="brand__text">
        <div class="brand__country">नेपाल सरकार · मधेश प्रदेश</div>
        <h1 class="brand__name">सूचना तथा समाचार</h1>
        <div class="brand__office">लहान नगरपालिका</div>
      </div>
    </div>
    <div class="top-bar__center">
      <div class="ticker"><span class="ticker__label"><i class="bi bi-megaphone-fill"></i> सूचना</span>
        <div class="ticker__viewport"><div class="ticker__track" id="ticker-track">…</div></div>
      </div>
    </div>
    <div class="top-bar__right">
      <div class="clock" id="clock">
        <div class="clock__time" id="clock-time">--:--:--</div>
        <div class="clock__date"><span id="date-bs">—</span><span class="clock__sep">·</span><span id="date-ad">—</span></div>
      </div>
      <button class="btn-lang" id="btn-lang" type="button"><i class="bi bi-translate"></i><span>EN</span></button>
    </div>
  </header>

  <nav class="breadcrumb-bar">
    <a href="index.html"><i class="bi bi-house-door-fill"></i> मुख्य पृष्ठ</a>
    <span class="sep">›</span><span>सूचना तथा समाचार</span>
  </nav>

  <main>
    <div class="notice-list" id="notice-list">
      <div class="skeleton" style="height:96px"></div>
      <div class="skeleton" style="height:96px"></div>
      <div class="skeleton" style="height:96px"></div>
    </div>
  </main>

  <footer class="kiosk-bar">
    <a class="kiosk-bar__btn" href="index.html"><i class="bi bi-house-door-fill"></i><span>मुख्य पृष्ठ</span></a>
    <a class="kiosk-bar__btn" href="assistant.html"><i class="bi bi-robot"></i><span>AI सहायक</span></a>
    <a class="kiosk-bar__btn" href="notices.html"><i class="bi bi-megaphone-fill"></i><span>सूचना</span></a>
    <a class="kiosk-bar__btn" href="token.html"><i class="bi bi-ticket-detailed-fill"></i><span>टोकन</span></a>
    <a class="kiosk-bar__btn" href="directory.html"><i class="bi bi-map-fill"></i><span>दिशा-निर्देश</span></a>
    <a class="kiosk-bar__btn" href="feedback.html"><i class="bi bi-chat-left-text-fill"></i><span>गुनासो</span></a>
    <button class="kiosk-bar__btn" id="btn-voice" type="button"><i class="bi bi-mic-fill"></i><span>आवाज</span></button>
  </footer>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/nepali-date.js" defer></script>
  <script src="assets/js/clock.js" defer></script>
  <script src="assets/js/ticker.js" defer></script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      const root = document.getElementById('notice-list');
      const list = await window.API.notices();
      if (!list || !list.length) { root.innerHTML = '<p>हाल कुनै सूचना उपलब्ध छैन।</p>'; return; }
      const NE_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      root.innerHTML = list.map(n => {
        const d = new Date(n.published_at || Date.now());
        const urgent = (n.category || '').includes('आपत') || n.is_urgent;
        return `
          <article class="notice-item ${urgent ? 'notice-item--urgent' : ''} fade-in">
            <div class="notice-date">
              <div class="notice-date__day">${d.getDate()}</div>
              <div class="notice-date__mon">${NE_MON[d.getMonth()]} ${d.getFullYear()}</div>
            </div>
            <div>
              <div class="notice-title">${escape(n.title)}</div>
              <div class="notice-summary">${escape(n.summary || '')}</div>
            </div>
            <div class="notice-cat">${escape(n.category || 'सूचना')}</div>
          </article>`;
      }).join('');
      function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    });
  </script>
</body>
</html>
