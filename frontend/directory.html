<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>दिशा-निर्देश · लहान नगरपालिका</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/main.css" rel="stylesheet" />
  <link href="assets/css/kiosk.css" rel="stylesheet" />
  <link href="assets/css/department.css" rel="stylesheet" />
  <style>
    .dir-wrap { padding: 24px 28px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; }
    @media (max-width: 1100px) { .dir-wrap { grid-template-columns: 1fr; } }
    .floor-map {
      background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 18px; box-shadow: var(--shadow-sm); position: sticky; top: 110px;
    }
    .floor-map svg { width: 100%; height: auto; }
    .floor-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .floor-tabs button {
      flex: 1; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff;
      font-weight: 700; color: var(--np-blue-700); cursor: pointer;
    }
    .floor-tabs button.active { background: var(--np-blue); color: #fff; border-color: var(--np-blue); }
    .dir-list  { display: grid; gap: 12px; }
    .dir-card  {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
      display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .dir-card__icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, var(--np-blue), var(--np-blue-700));
      color: #fff; display:flex; align-items:center; justify-content:center; font-size: 24px;
    }
    .dir-card__title { font-weight: 700; color: var(--np-blue-700); }
    .dir-card__meta  { font-size: 14px; color: var(--ink-muted); }
    .dir-card__cta   { font-size: 14px; }
    .room-pin { fill: var(--np-red); stroke: #fff; stroke-width: 2; cursor: pointer; transition: r .15s ease; }
    .room-pin.active { fill: var(--np-saffron); }
    .room-pin:hover  { r: 14; }
  </style>
</head>
<body class="kiosk" data-page="directory">

  <header class="top-bar">
    <div class="brand">
      <img src="assets/img/logo.svg" class="brand__logo" alt="logo"/>
      <div class="brand__text">
        <div class="brand__country">नेपाल सरकार · मधेश प्रदेश</div>
        <h1 class="brand__name">कार्यालय दिशा-निर्देश</h1>
        <div class="brand__office">लहान नगरपालिका</div>
      </div>
    </div>
    <div class="top-bar__center">
      <div class="ticker"><span class="ticker__label"><i class="bi bi-map-fill"></i> नक्सा</span>
        <div class="ticker__viewport"><div class="ticker__track" id="ticker-track">…</div></div>
      </div>
    </div>
    <div class="top-bar__right">
      <div class="clock" id="clock">
        <div class="clock__time" id="clock-time">--:--:--</div>
        <div class="clock__date"><span id="date-bs">—</span><span class="clock__sep">·</span><span id="date-ad">—</span></div>
      </div>
      <button class="btn-lang" id="btn-lang" type="button"><i class="bi bi-translate"></i><span>EN</span></button>
    </div>
  </header>

  <nav class="breadcrumb-bar">
    <a href="index.html"><i class="bi bi-house-door-fill"></i> मुख्य पृष्ठ</a>
    <span class="sep">›</span><span>कार्यालय दिशा-निर्देश</span>
  </nav>

  <main class="dir-wrap">
    <section>
      <div class="floor-tabs" id="floor-tabs">
        <button data-floor="1" class="active">पहिलो तला</button>
        <button data-floor="2">दोस्रो तला</button>
        <button data-floor="3">तेस्रो तला</button>
        <button data-floor="0">भुइँ तला</button>
      </div>
      <div class="dir-list" id="dir-list"></div>
    </section>

    <aside class="floor-map">
      <h3 style="color:var(--np-blue-700)"><i class="bi bi-geo-alt-fill"></i> स्मार्ट फ्लोर म्याप</h3>
      <p class="muted" style="font-size:14px">शाखा छनौट गर्दा सम्बन्धित कोठा हाइलाइट हुनेछ।</p>
      <svg viewBox="0 0 600 360" role="img" aria-label="Floor map">
        <rect x="10" y="10" width="580" height="340" fill="#f0f5ff" stroke="#cbd5e1" rx="14"/>
        <rect x="40" y="40" width="160" height="120" fill="#fff" stroke="#cbd5e1" rx="8"/>
        <text x="120" y="105" text-anchor="middle" font-size="14" fill="#475569">रिसेप्सन / प्रतीक्षा</text>

        <rect x="220" y="40" width="160" height="120" fill="#fff" stroke="#cbd5e1" rx="8"/>
        <text x="300" y="100" text-anchor="middle" font-size="14" fill="#475569">सेवा कक्ष</text>

        <rect x="400" y="40" width="160" height="120" fill="#fff" stroke="#cbd5e1" rx="8"/>
        <text x="480" y="100" text-anchor="middle" font-size="14" fill="#475569">कोठा क्षेत्र</text>

        <rect x="40" y="200" width="520" height="120" fill="#fff" stroke="#cbd5e1" rx="8"/>
        <text x="300" y="265" text-anchor="middle" font-size="14" fill="#475569">कक्षहरू</text>

        <g id="pins"></g>
        <g id="entry">
          <rect x="280" y="332" width="40" height="14" fill="#dc143c"/>
          <text x="300" y="356" text-anchor="middle" font-size="11" fill="#dc143c">प्रवेशद्वार</text>
        </g>
      </svg>
      <div id="active-info" class="muted" style="margin-top:10px">कुनै शाखा छनौट गरिएको छैन।</div>
    </aside>
  </main>

  <footer class="kiosk-bar">
    <a class="kiosk-bar__btn" href="index.html"><i class="bi bi-house-door-fill"></i><span>मुख्य पृष्ठ</span></a>
    <a class="kiosk-bar__btn" href="assistant.html"><i class="bi bi-robot"></i><span>AI सहायक</span></a>
    <a class="kiosk-bar__btn" href="notices.html"><i class="bi bi-megaphone-fill"></i><span>सूचना</span></a>
    <a class="kiosk-bar__btn" href="token.html"><i class="bi bi-ticket-detailed-fill"></i><span>टोकन</span></a>
    <a class="kiosk-bar__btn" href="directory.html"><i class="bi bi-map-fill"></i><span>दिशा-निर्देश</span></a>
    <a class="kiosk-bar__btn" href="feedback.html"><i class="bi bi-chat-left-text-fill"></i><span>गुनासो</span></a>
    <button class="kiosk-bar__btn" id="btn-voice" type="button"><i class="bi bi-mic-fill"></i><span>आवाज</span></button>
  </footer>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/nepali-date.js" defer></script>
  <script src="assets/js/clock.js" defer></script>
  <script src="assets/js/ticker.js" defer></script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', async () => {
      const ICONS = {
        'planning':'bi-graph-up-arrow','it':'bi-cpu','sanitation':'bi-trash3','health':'bi-heart-pulse',
        'education':'bi-mortarboard','wash':'bi-droplet-half','building-permit':'bi-building-gear',
        'revenue':'bi-coin','women-children':'bi-people','employment':'bi-briefcase',
        'registration':'bi-journal-text','town-police':'bi-shield-check','agriculture':'bi-tree',
        'livestock':'bi-piggy-bank','administration':'bi-bank2','social-security':'bi-life-preserver',
        'disaster':'bi-exclamation-triangle','judicial':'bi-hammer','wards':'bi-geo-alt'
      };
      const list = (await window.API.departments()) || [];
      const tabs = document.getElementById('floor-tabs');
      const dirList = document.getElementById('dir-list');
      const pins = document.getElementById('pins');
      const info = document.getElementById('active-info');

      const FLOORS = { '0':['भुइँ तला'], '1':['पहिलो तला'], '2':['दोस्रो तला'], '3':['तेस्रो तला'] };
      let activeFloor = '1';

      function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

      function pinFor(idx) {
        // simple grid layout for pins
        const cols = 6;
        const r = Math.floor(idx / cols), c = idx % cols;
        return { x: 70 + c * 90, y: 230 + r * 30 };
      }

      function render() {
        const items = list.filter(d => (FLOORS[activeFloor] || []).some(f => (d.floor || '').includes(f)));
        dirList.innerHTML = items.length ? items.map((d, i) => `
          <article class="dir-card" data-slug="${d.slug}">
            <div class="dir-card__icon"><i class="bi ${ICONS[d.slug]||'bi-building'}"></i></div>
            <div>
              <div class="dir-card__title">${escape(d.name)}</div>
              <div class="dir-card__meta">${escape(d.room || '')} ${d.floor ? '· ' + escape(d.floor) : ''} ${d.timings ? '· ' + escape(d.timings) : ''}</div>
            </div>
            <a class="btn-kiosk btn-kiosk--ghost dir-card__cta" href="department.html?slug=${d.slug}"><i class="bi bi-info-circle"></i> विवरण</a>
          </article>
        `).join('') : '<p class="muted">यस तलामा सूचीकृत शाखा छैन।</p>';

        pins.innerHTML = items.map((d, i) => {
          const p = pinFor(i);
          return `<g><circle class="room-pin" data-slug="${d.slug}" cx="${p.x}" cy="${p.y}" r="11"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${i+1}</text></g>`;
        }).join('');
      }

      tabs.addEventListener('click', e => {
        const b = e.target.closest('button[data-floor]'); if (!b) return;
        [...tabs.children].forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeFloor = b.dataset.floor;
        render();
      });

      document.addEventListener('click', e => {
        const card = e.target.closest('.dir-card');
        const pin  = e.target.closest('.room-pin');
        const slug = card?.dataset.slug || pin?.dataset.slug;
        if (!slug) return;
        const d = list.find(x => x.slug === slug);
        if (!d) return;
        document.querySelectorAll('.room-pin').forEach(p => p.classList.toggle('active', p.dataset.slug === slug));
        info.innerHTML = `<strong>${escape(d.name)}</strong> — ${escape(d.room || '')} · ${escape(d.floor || '')}`;
      });

      render();
    });
  </script>
</body>
</html>
